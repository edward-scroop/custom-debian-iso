[package]
name = "custom-debian-iso"
description = ""
repository = "https://github.com/edward-scroop/custom-debian-iso"
license = "GPL-3.0-or-later"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.94.1"

[package.metadata.deb]
revision = "1"
maintainer = "Edward Scroop <edward.scroop@gmail.com>"
copyright = "2026 Edward Scroop <edward.scroop@gmail.com>"
profile = "release"
depends = "$auto, xorriso, isolinux"
assets = [
    ["target/release/create-custom-iso", "/usr/bin/create-custom-iso", "755"],
    ["pkg/common/custom-debian-iso/**/*", "/etc/custom-debian-iso/", "644"],
]
maintainer-scripts = "pkg/debian/"

[[bin]]
name = "create-custom-iso"
path = "src/main.rs"

[profile.dev]
opt-level = 2
debug = "line-tables-only" 
strip = "none"
lto = "off"
panic = "abort"
incremental = true
codegen-units = 256

[profile.dev-full]
inherits = "dev"
debug = "full"

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
debug = "none"
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 8

[profile.bench]
inherits = "release"

[dependencies]
jiff = {
    version = "=0.2.37",
    features = [
        "logging",
        "serde"
    ]
}
toml = {
    version = "=1.1.6",
    features = [
        "preserve_order",
    ]
}
serde = {
    version = "=1.0.229",
    features = [
        "derive",
        "alloc"
    ]
}
serde_json = "=1.0.151"
clap = {
    version = "=4.6.7",
    features = [
        "derive"
    ]
}
minijinja = "=3.0.5"

[lints.rust]
warnings = { level = "warn", priority = -1 }
deprecated_safe = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
refining_impl_trait = { level = "warn", priority = -1 }
unknown_or_malformed_diagnostic_attributes = { level = "warn", priority = -1 } 
unused = { level = "warn", priority = -1 } 

# Forbid until last resort
unsafe_code = "forbid"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
 
# Restriction
unwrap_used = "deny"

# Pedantic
too_many_lines = "allow"

