iso = "debian-13.7.0-amd64-netinst.iso"

files = [
    { source = "partitioning.sh", iso_path = "/", install_path = "/tmp", early = true }
]

[config]
script-file = "config.sh"

[preseed]
# Localization
'd-i debian-installer/locale string' = 'en_US.UTF-8'
'd-i keyboard-configuration/xkb-keymap select' = 'us'

# Network configuration
'd-i netcfg/choose_interface select' = 'ens18'
'd-i netcfg/link_wait_timeout string' = '5'
## Set this to false to enable dhcp
'd-i netcfg/disable_autoconfig boolean' = 'true'
'd-i netcfg/get_ipaddress string' = '10.0.0.2'
'd-i netcfg/get_netmask string' = '255.255.255.0'
'd-i netcfg/get_gateway string' = '10.0.0.1'
'd-i netcfg/get_nameservers string' = '10.0.0.3'
'd-i netcfg/confirm_static boolean' = 'true'
'd-i netcfg/get_hostname string' = 'base'
'd-i netcfg/get_domain string' = 'example.com'
'd-i netcfg/wireless_wep string' = ''
'd-i hw-detect/load_firmware boolean' = 'true'

# Mirror settings
'd-i mirror/country string manual' = 'us'
'd-i mirror/http/hostname string' = 'deb.debian.org'
'd-i mirror/http/directory string' = '/debian'

# Account setup
'd-i passwd/root-login boolean' = 'true'
'd-i passwd/make-user boolean' = 'true'
'd-i passwd/root-password-crypted password' = # YOUR HASHED PASSWORD HERE
'd-i passwd/user-fullname string' = 'user name'
'd-i passwd/username string' = 'user'
'd-i passwd/user-password-crypted password' = # YOUR HASHED PASSWORD HERE
'd-i passwd/user-default-groups string' = 'audio cdrom video sudo'

# Clock and time zone setup
'd-i clock-setup/utc boolean' = 'true'
'd-i time/zone string' = 'Australia/Perth'
'd-i clock-setup/ntp boolean' = 'true'
'd-i clock-setup/ntp-server string' = 'pool.ntp.org'

# Partitioning
## Done dynamically in partitioning.sh

# Base system installation
'd-i base-installer/install-recommends boolean' = 'false'

# Apt setup
'd-i apt-setup/cdrom/set-first boolean' = 'false'
'd-i apt-setup/non-free-firmware boolean' = 'true'
'd-i apt-setup/non-free boolean' = 'true'
'd-i apt-setup/contrib boolean' = 'true'
'd-i apt-setup/disable-cdrom-entries boolean' = 'true'
'd-i apt-setup/use_mirror boolean' = 'true'
'd-i apt-setup/services-select multiselect' = 'security, updates'
'd-i apt-setup/security_host string' = 'deb.debian.org'

# Package selection
'tasksel tasksel/first multiselect' = 'standard, ssh-server'
'popularity-contest popularity-contest/participate boolean' = 'false'

# Finishing up the installation
'd-i finish-install/keep-consoles boolean' = 'true'
'd-i finish-install/reboot_in_progress note' = ''
'd-i cdrom-detect/eject boolean' = 'true'
'd-i debian-installer/exit/halt boolean' = 'false'
'd-i debian-installer/exit/poweroff boolean' = 'false'

# Advanced options
'd-i partman/early_command string' = """\
chmod +x /tmp/partitioning.sh; \
/tmp/partitioning.sh; \
if mount | grep media; then umount /media; fi\
"""
